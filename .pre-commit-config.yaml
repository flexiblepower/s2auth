exclude: '^(docs/conf\.py|specification/.*|src/s2auth/common/models\.py)$'

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: trailing-whitespace
  - id: check-added-large-files
  - id: check-ast
  - id: check-json
  - id: check-merge-conflict
  - id: check-xml
  - id: check-yaml
  - id: debug-statements
  - id: end-of-file-fixer
  - id: requirements-txt-fixer
  - id: mixed-line-ending
    args: ['--fix=auto']  # replace 'auto' with 'lf' to enforce Linux/Mac line endings or 'crlf' for Windows
- repo: local # use local hooks for everything that can be run with poetry, to make sure we don't get version conflicts between this file and pyproject.toml
  hooks:
    - id: ruff
      name: ruff
      language: system
      entry: poetry run ruff check --fix --force-exclude
      files: ".py$"
      pass_filenames: true
    - id: pyright
      name: pyright
      language: system
      entry: poetry run pyright
      files: "(.py|.pyi)$"
      pass_filenames: true
    - id: poetry-check
      name: poetry check format of pyproject.toml
      language: system
      entry: poetry check --no-interaction --quiet
      files: "^pyproject.toml$"
      pass_filenames: false
    - id: poetry-lock-check
      name: poetry lock check
      language: system
      entry: poetry check --lock --no-interaction
      files: "^(poetry.lock|pyproject.toml)$"
      pass_filenames: false
    - id: pytest
      name: pytest
      language: system
      entry: poetry run pytest
      pass_filenames: false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[project]
name = "s2auth"
version = "0.1.0a0"
authors = [
    {name = "Flexiblepower", email = "info@info.nl"},
    {name = "Dolf Andringa", email = "dolf@wepositive.energy"},
]
description = "S2 Protocol Python Wrapper"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9, < 3.14"
dependencies = [
    "pydantic>=2.8.2",
    "pytz",
    "click",
    "typing-extensions",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
    "Source code" = "https://github.com/flexiblepower/s2-ws-json-python"

[dependency-groups]
docs = [
    "sphinx",
    "sphinx-rtd-theme >= 1.2",
    "sphinx-tabs",
    "sphinx_copybutton",
    "sphinx_fontawesome",
    "sphinxcontrib.httpdomain",
]
dev = [
    "pytest (<9)", # because we want to support python 3.9
    "pytest-coverage",
    "pytest-timer",
    "types-pytz",
    "pyright",
    "ruff",
    "fastapi-code-generator",
    "pre-commit",
]

[tool.poetry.requires-plugins]
poetry-plugin-shell = "*"


[tool.pytest.ini_options]
testpaths = "tests"
addopts = [
	"--cov=s2auth",
	"--cov-report=html:./unit_test_coverage/",
	"-v",
	"tests/unit/"
]

[tool.pyright]
stubPath = "./typings/"
reportImportCycles = false
typeCheckingMode = "strict"
exclude = [
    "./src/s2auth/common/models.py",
    "./typings/*",
    "**/__pycache__",
    "**/.*",
]
venv = ".venv"
venvPath = "."


[tool.coverage.run]
branch = true
source = ["./src"]

[tool.coverage.report]
exclude_also = [
    "if .*TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\(Protocol\\):",
    "@abc.abstractmethod",
    "@abstractmethod",
]
show_missing = true

[tool.ruff]
extend-exclude = ["typings/*"]
